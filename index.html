<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<meta name="theme-color" content="#1f262b">
<title>집들이 레시피북</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>:root{--ink:#1f262b;--sub:#59626a;--mute:#8a939a;--line:#d3d9dd;--bg1:#eef1f3;--bg2:#e2e6e9;--card:#fff;--soft:#f1f3f5;--ok:#eaf4ec;--okb:#4f7a2f;--bad:#fdecec;--timer:#b8662f;--est:#fff1c9;--estt:#7a5a00}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(var(--bg1),var(--bg2)) fixed;color:var(--ink);font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:10px 12px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;min-height:100dvh}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:5px;padding:6px 0;background:var(--bg1)}
.tabs button{flex:1;min-height:44px;border-radius:11px;background:#d3d9dd;color:var(--sub);font-size:15px}
.tabs button.on{background:var(--ink);color:#fff;font-weight:800}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:7px;color:#fff;font-weight:700;white-space:nowrap}
.timers{display:flex;flex-direction:column;gap:6px}
.timer{background:#fff;border:1.5px solid #d99a5b;border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px}
.timer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer b{font-variant-numeric:tabular-nums;font-size:18px}
.timer.fin{background:#c23a3a;border-color:#c23a3a;color:#fff;animation:blink 1s infinite}
.timer.fin button{background:#fff;color:#c23a3a;border-radius:9px;padding:6px 10px;font-weight:800;min-height:36px}
@keyframes blink{50%{opacity:.6}}
.card{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 #c5ccd1}
.prog{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub)}
.action{font-size:21px;font-weight:800;line-height:1.4;word-break:keep-all}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.meta div{background:var(--soft);border-radius:10px;padding:6px 8px;font-size:12px;color:var(--sub);min-width:0}
.meta b{display:block;font-size:15px;color:var(--ink);word-break:keep-all}
.ing{margin:0;padding:8px 0 0;list-style:none;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:5px;font-size:15px}
.ing li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.ing .amt{font-weight:800}
.ing small{color:var(--mute);font-size:12.5px}
.est{background:var(--est);color:var(--estt);font-size:11px;padding:1px 6px;border-radius:5px;font-weight:800}
.sig{background:var(--ok);border-radius:10px;padding:8px 10px;font-size:15px;line-height:1.45}
.warn{background:var(--bad);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.45}
.lbl{font-weight:800;margin-right:4px}
.tbtn{background:var(--timer);color:#fff;border-radius:12px;min-height:50px;font-weight:800;font-size:17px}
.vid{align-self:flex-end;font-size:13px;color:#2f6a7d;text-decoration:none;padding:6px 0}
.next{font-size:14px;color:var(--sub);background:#d9dfe2;border-radius:11px;padding:9px 11px;word-break:keep-all}
.nav{display:flex;gap:8px;position:sticky;bottom:calc(8px + env(safe-area-inset-bottom))}
.back{background:#c5ccd1;border-radius:14px;min-width:60px;min-height:58px;font-weight:800;font-size:15px}
.done{flex:1;background:var(--ink);color:#fff;border-radius:14px;min-height:58px;font-weight:800;font-size:19px}
.dish{background:#fff;border-radius:14px;padding:10px 12px}
.dish h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px 0;font-size:15px;min-height:44px;border-top:1px solid #eef1f3;word-break:keep-all}
.row:first-of-type{border-top:0}
.row.ok{color:#9aa3ab;text-decoration:line-through}
.row.now{font-weight:800}
.bx{width:22px;height:22px;border:2px solid #9aa3ab;border-radius:6px;flex:none;display:grid;place-items:center;color:#fff;font-size:14px}
.row.ok .bx{background:var(--okb);border-color:var(--okb)}
.row.now .bx{border-color:var(--ink)}
.row .txt{flex:1}
.notice{background:var(--ink);color:#fff;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}
.notice p{margin:0}
.grp{background:#fff;border-radius:14px;padding:8px 12px}
.grp h3{margin:4px 0;font-size:13px;color:var(--sub)}
.row .amt{margin-left:auto;font-weight:800;text-align:right;max-width:45%}
.foot{font-size:12px;color:var(--mute);text-align:center;line-height:1.6;padding:8px 0}
.foot button{color:#c23a3a;text-decoration:underline;min-height:44px;padding:0 8px}
.hint{background:#fff3e6;border-radius:10px;padding:8px 10px;font-size:13px}
.complete{text-align:center;padding:30px 14px}
.complete h2{margin:0 0 8px;font-size:24px}
</style>
</head>

ucc44\uc6b4 \uac12","min":"\ubd84","sec":"\ucd08"},"version":"436bdd19"}</script>
<script type="module">// Cook-along state. Pure functions: no DOM, no clock — `now` is always passed in (ms).

function initState(data) {
  return { version: data.version, done: [], cursor: null, timers: [], shopDone: [], tab: "line" };
}

const idx = (data, id) => data.steps.findIndex((s) => s.id === id);

function currentStep(state, data) {
  if (state.cursor) {
    const s = data.steps.find((x) => x.id === state.cursor);
    if (s) return s;
  }
  return data.steps.find((s) => !state.done.includes(s.id)) ?? null;
}

function markDone(state, data, stepId) {
  const done = state.done.includes(stepId) ? state.done : [...state.done, stepId];
  return { ...state, done, cursor: null };
}

function undoDone(state, stepId) {
  return { ...state, done: state.done.filter((id) => id !== stepId), cursor: null };
}

function goTo(state, stepId) {
  return { ...state, cursor: stepId };
}

function goBack(state, data) {
  const cur = currentStep(state, data);
  const i = cur ? idx(data, cur.id) : data.steps.length;
  if (i <= 0) return state;
  const prev = data.steps[i - 1];
  return { ...state, done: state.done.filter((id) => id !== prev.id), cursor: prev.id };
}

function reset(data) {
  return initState(data);
}

function startTimer(state, step, now) {
  const timers = state.timers.filter((t) => t.stepId !== step.id);
  timers.push({ stepId: step.id, endsAt: now + step.timer_sec * 1000, alerted: false });
  return { ...state, timers };
}

function dismissTimer(state, stepId) {
  return { ...state, timers: state.timers.filter((t) => t.stepId !== stepId) };
}

function remaining(timer, now) {
  return Math.max(0, Math.ceil((timer.endsAt - now) / 1000));
}

function tick(state, now) {
  const finished = [];
  const timers = state.timers.map((t) => {
    if (!t.alerted && t.endsAt <= now) {
      finished.push(t.stepId);
      return { ...t, alerted: true };
    }
    return t;
  });
  return { state: finished.length ? { ...state, timers } : state, finished };
}

function toggleShop(state, key) {
  const has = state.shopDone.includes(key);
  return { ...state, shopDone: has ? state.shopDone.filter((k) => k !== key) : [...state.shopDone, key] };
}

function serialize(state) {
  return JSON.stringify(state);
}

function load(raw, data) {
  const fresh = initState(data);
  let s;
  try {
    s = JSON.parse(raw ?? "");
  } catch {
    return fresh;
  }
  if (!s || typeof s !== "object" || s.version !== data.version) return fresh;
  const ids = new Set(data.steps.map((x) => x.id));
  const arr = (v) => (Array.isArray(v) ? v : []);
  return {
    ...fresh,
    done: arr(s.done).filter((id) => ids.has(id)),
    cursor: ids.has(s.cursor) ? s.cursor : null,
    timers: arr(s.timers).filter((t) => t && ids.has(t.stepId) && Number.isFinite(t.endsAt))
      .map((t) => ({ stepId: t.stepId, endsAt: t.endsAt, alerted: !!t.alerted })),
    shopDone: arr(s.shopDone).filter((k) => typeof k === "string"),
    tab: ["line", "dish", "shop"].includes(s.tab) ? s.tab : "line",
  };
}
const core = { initState, currentStep, markDone, undoDone, goTo, goBack, reset, startTimer, dismissTimer, remaining, tick, toggleShop, serialize, load };

const DATA = JSON.parse(document.getElementById("data").textContent);
const U = DATA.ui;
const KEY = "hw-book";
const dishById = Object.fromEntries(DATA.dishes.map((d) => [d.id, d]));
const app = document.getElementById("app");

let state = core.load(safeGet(), DATA);
let resetArmed = false;
let audio = null;
let wakeLock = null;
let wakeUnsupported = !("wakeLock" in navigator);

function safeGet() {
  try { return localStorage.getItem(KEY); } catch { return null; }
}
function save() {
  try { localStorage.setItem(KEY, core.serialize(state)); } catch { /* storage off: keep going */ }
}
function set(next) {
  state = next;
  save();
  render();
}

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const tag = (dishId) => {
  const d = dishById[dishId];
  return `<span class="tag" style="background:${d.color}">${esc(d.name)}</span>`;
};
const mmss = (sec) => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
const estBadge = `<span class="est">${esc(U.est)}</span>`;
const isEst = (step, field) => (step.est || []).includes(field);

function timersHtml(now) {
  if (!state.timers.length) return "";
  const rows = state.timers.map((t) => {
    const step = DATA.steps.find((s) => s.id === t.stepId);
    const left = core.remaining(t, now);
    const label = `${tag(step.dish)} ${esc(step.time || "")}`;
    if (left === 0) {
      return `<div class="timer fin"><span class="nm">${label}</span><button data-act="dismiss" data-id="${t.stepId}">${esc(U.finished)}</button></div>`;
    }
    return `<div class="timer"><span class="nm">${label} · ${esc(U.running)}</span><b>${mmss(left)}</b></div>`;
  });
  return `<div class="timers">${rows.join("")}</div>`;
}

function stepCard(step) {
  const n = DATA.steps.indexOf(step) + 1;
  const ings = (step.ingredients || []).map((i) => `<li><span>${esc(i.name)}</span><span class="amt">${esc(i.amount)}</span>${
    i.orig ? `<small>· ${esc(U.orig)} ${esc(i.orig)}</small>` : ""}${i.est ? estBadge : ""}</li>`).join("");
  const running = state.timers.find((t) => t.stepId === step.id);
  const timerBtn = step.timer_sec
    ? `<button class="tbtn" data-act="timer" data-id="${step.id}">⏱ ${esc(step.time)} ${esc(running ? U.timer_restart : U.timer)}</button>` : "";
  const dish = dishById[step.dish];
  const vid = dish.video && step.video_t != null
    ? `<a class="vid" target="_blank" rel="noopener" href="https://youtu.be/${dish.video}?t=${step.video_t}">▶ ${esc(U.video)}</a>` : "";
  return `<div class="card">
    <div class="prog">${tag(step.dish)}<span>${n} / ${DATA.steps.length}</span></div>
    <div class="action">${esc(step.action)}</div>
    <div class="meta">
      <div>${esc(U.heat)}<b>${esc(step.heat)}</b>${isEst(step, "heat") ? estBadge : ""}</div>
      <div>${esc(U.time)}<b>${esc(step.time || "—")}</b>${isEst(step, "time") ? estBadge : ""}</div>
      <div>${esc(U.tools)}<b>${esc(step.tools)}</b></div>
    </div>
    ${ings ? `<ul class="ing">${ings}</ul>` : ""}
    <div class="sig"><span class="lbl">✔ ${esc(U.signal)}</span>${esc(step.signal)}</div>
    ${step.warn ? `<div class="warn"><span class="lbl">⚠ ${esc(U.warn)}</span>${esc(step.warn)}</div>` : ""}
    ${timerBtn}${vid}
  </div>`;
}

function lineView(now) {
  const step = core.currentStep(state, DATA);
  if (!step) {
    return `${timersHtml(now)}<div class="card complete"><h2>${esc(U.complete_title)}</h2><p>${esc(U.complete_body)}</p></div>
      <div class="nav"><button class="back" data-act="back">← ${esc(U.back)}</button></div>`;
  }
  const i = DATA.steps.indexOf(step);
  const nxt = DATA.steps.slice(i + 1).find((s) => !state.done.includes(s.id));
  const hints = [];
  if (wakeUnsupported) hints.push(U.wakelock_off);
  if (!audio) hints.push(U.sound_hint);
  return `${timersHtml(now)}${stepCard(step)}
    ${nxt ? `<div class="next">${esc(U.next)} → ${esc(nxt.action)}</div>` : ""}
    ${hints.map((h) => `<div class="hint">${esc(h)}</div>`).join("")}
    <div class="nav"><button class="back" data-act="back" aria-label="${esc(U.back)}">←</button><button class="done" data-act="done" data-id="${step.id}">${esc(U.done)}</button></div>`;
}

function dishView() {
  const cur = core.currentStep(state, DATA);
  return DATA.dishes.map((d) => {
    const steps = DATA.steps.filter((s) => s.dish === d.id);
    const n = steps.filter((s) => state.done.includes(s.id)).length;
    const rows = steps.map((s) => {
      const ok = state.done.includes(s.id);
      const cls = ok ? "ok" : cur && cur.id === s.id ? "now" : "";
      return `<div class="row ${cls}"><button class="bx" data-act="toggle" data-id="${s.id}" aria-label="${esc(U.done)}">${ok ? "✓" : ""}</button>
        <button class="txt" style="text-align:left" data-act="goto" data-id="${s.id}">${esc(s.action)}${cls === "now" ? ` ← ${esc(U.now)}` : ""}</button></div>`;
    }).join("");
    return `<div class="dish"><h3>${tag(d.id)}<span>${n}/${steps.length}</span></h3>${rows}</div>`;
  }).join("");
}

function shopView() {
  const sections = [...new Set(DATA.shopping.map((x) => x.section))];
  const notices = `<div class="notice">${DATA.notices.map((n) => `<p>${esc(n)}</p>`).join("")}</div>`;
  return notices + sections.map((sec) => {
    const rows = DATA.shopping.filter((x) => x.section === sec).map((x) => {
      const k = `${x.section}|${x.name}`;
      const ok = state.shopDone.includes(k);
      return `<button class="row ${ok ? "ok" : ""}" data-act="shop" data-key="${esc(k)}"><span class="bx">${ok ? "✓" : ""}</span>
        <span class="txt">${esc(x.name)} ${x.est ? estBadge : ""}</span><span class="amt">${esc(x.amount)}</span></button>`;
    }).join("");
    return `<div class="grp"><h3>${esc(sec)}</h3>${rows}</div>`;
  }).join("");
}

function render() {
  const now = Date.now();
  const body = state.tab === "dish" ? dishView() : state.tab === "shop" ? shopView() : lineView(now);
  const tabs = ["line", "dish", "shop"].map((t) =>
    `<button class="${state.tab === t ? "on" : ""}" data-act="tab" data-tab="${t}">${esc(U.tabs[t])}</button>`).join("");
  app.innerHTML = `<nav class="tabs">${tabs}</nav>${body}
    <div class="foot">${esc(U.est_note)}<br><button data-act="reset">${esc(resetArmed ? U.reset_confirm : U.reset)}</button></div>`;
}

function beep() {
  if (!audio) return;
  const t0 = audio.currentTime;
  for (let i = 0; i < 3; i++) {
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t0 + i * 0.5);
    g.gain.exponentialRampToValueAtTime(0.4, t0 + i * 0.5 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.5 + 0.35);
    o.connect(g).connect(audio.destination);
    o.start(t0 + i * 0.5);
    o.stop(t0 + i * 0.5 + 0.4);
  }
}

function onTick() {
  const r = core.tick(state, Date.now());
  if (r.finished.length) {
    state = r.state;
    save();
    beep();
    navigator.vibrate?.([300, 150, 300]);
  }
  if (state.timers.length) render();
}

async function keepAwake() {
  if (wakeUnsupported || document.visibilityState !== "visible") return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
  } catch {
    wakeUnsupported = true;
    render();
  }
}

app.addEventListener("click", (e) => {
  if (!audio) {
    try {
      audio = new (window.AudioContext || window.webkitAudioContext)();
    } catch { /* no audio */ }
  }
  audio?.resume?.();
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const { act, id } = el.dataset;
  if (act !== "reset") resetArmed = false;
  const step = DATA.steps.find((s) => s.id === id);
  if (act === "tab") return set({ ...state, tab: el.dataset.tab });
  if (act === "done") { set(core.markDone(state, DATA, id)); return window.scrollTo(0, 0); }
  if (act === "back") return set(core.goBack(state, DATA));
  if (act === "timer") return set(core.startTimer(state, step, Date.now()));
  if (act === "dismiss") return set(core.dismissTimer(state, id));
  if (act === "toggle") return set(state.done.includes(id) ? core.undoDone(state, id) : core.markDone(state, DATA, id));
  if (act === "goto") { set({ ...core.goTo(state, id), tab: "line" }); return window.scrollTo(0, 0); }
  if (act === "shop") return set(core.toggleShop(state, el.dataset.key));
  if (act === "reset") {
    if (!resetArmed) { resetArmed = true; return render(); }
    resetArmed = false;
    return set(core.reset(DATA));
  }
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { onTick(); keepAwake(); render(); }
});

render();
keepAwake();
setInterval(onTick, 1000);
</script>
